# Opt-in RoboICL pure-pick view. Virtual optics, not a hardware calibration.
# Retain the native Franka mount; avoid clipping objects close to the fingers.
ROBOICL_PICK_WRIST_V1:
  fovy: 88
  w: 224
  h: 224
  near: 0.005
  far: 100

# RoboKata training/evaluation wrist view. Centre the optical origin on the
# jaw symmetry plane and move it 15 mm forward; retain the native orientation.
ROBOKATA_ALOHA_WRIST_224_V1:
  fovy: 88
  w: 224
  h: 224
  near: 0.005
  far: 100
  mount_offset_m: [0.015, -0.032, 0.0]

# Opt-in native square head optics; camera mount is unchanged.
ROBOICL_SELECT_HEAD_224_F37:
